<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Set character encoding and responsive layout -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Define the default page title and allow child templates to override it -->
    <title>{% block title %}Ticket Management System{% endblock %}</title>

    <!-- Load Bootstrap CSS for styling the website -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<!-- Set a light background color for the page -->
<body class="bg-light">

<!-- Navigation bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <!-- Link the website name to the ticket list page -->
        <a class="navbar-brand" href="{% url 'ticket_list' %}">
            Ticket Management
        </a>

        <div class="d-flex align-items-center gap-3">

            <!-- Show the username and logout button to logged-in users -->
            {% if user.is_authenticated %}

                <span class="text-white">
                    Welcome, {{ user.username }}
                </span>

                <!-- Send a POST request to log the user out -->
                <form method="post" action="{% url 'logout' %}" class="mb-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-sm">
                        Logout
                    </button>
                </form>

            <!-- Show login and registration links to logged-out users -->
            {% else %}

                <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">
                    Login
                </a>

                <a href="{% url 'register' %}" class="btn btn-danger btn-sm">
                    Register
                </a>

            {% endif %}

        </div>
    </div>
</nav>

<!-- Main content area shared by all pages -->
<main class="container py-4">

    <!-- Display success or other messages when available -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show"
                 role="alert">
                {{ message }}

                <!-- Add a button to dismiss the message -->
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    <!-- Allow child templates to insert their page-specific content -->
    {% block content %}
    {% endblock %}

</main>

<!-- Load Bootstrap JavaScript for interactive components -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
