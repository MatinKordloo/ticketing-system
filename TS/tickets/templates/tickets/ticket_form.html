<!-- Use the shared base template -->
{% extends 'tickets/base.html' %}

<!-- Set the page title based on whether a ticket is being edited or created -->
{% block title %}
    {% if form.instance.pk %}Edit Ticket{% else %}Create Ticket{% endif %}
{% endblock %}

<!-- Start the page content -->
{% block content %}

<!-- Center the ticket form on the page -->
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

        <!-- Create a card to contain the ticket form -->
        <div class="card shadow-sm">
            <div class="card-body p-4">

                <!-- Display the appropriate heading -->
                <h1 class="h3 mb-4">
                    {% if form.instance.pk %}
                        Edit Ticket
                    {% else %}
                        Create New Ticket
                    {% endif %}
                </h1>

                <!-- Submit the ticket form using POST -->
                <form method="post">

                    <!-- Protect the form against CSRF attacks -->
                    {% csrf_token %}

                    <!-- Display the ticket fields generated by Django -->
                    {{ form.as_p }}

                    <!-- Show the appropriate submit button text -->
                    <button type="submit" class="btn btn-primary">
                        {% if form.instance.pk %}
                            Update Ticket
                        {% else %}
                            Create Ticket
                        {% endif %}
                    </button>

                    <!-- Return to the ticket list without submitting the form -->
                    <a href="{% url 'ticket_list' %}"
                       class="btn btn-secondary">
                        Cancel
                    </a>
                </form>

            </div>
        </div>

    </div>
</div>

<!-- End the page content -->
{% endblock %}
