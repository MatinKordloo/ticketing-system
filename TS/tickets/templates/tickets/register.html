<!-- Use the shared base template -->
{% extends 'tickets/base.html' %}

<!-- Set the page title -->
{% block title %}Register{% endblock %}

<!-- Start the page content -->
{% block content %}

<!-- Center the registration form on the page -->
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

        <!-- Create a card for the registration form -->
        <div class="card shadow-sm">
            <div class="card-body p-4">

                <!-- Display the page heading -->
                <h1 class="h3 mb-4 text-center">Create Account</h1>

                <!-- Submit the registration form using POST -->
                <form method="post">

                    <!-- Protect the form against CSRF attacks -->
                    {% csrf_token %}

                    <!-- Display the registration fields generated by Django -->
                    {{ form.as_p }}

                    <!-- Submit the registration form -->
                    <button type="submit" class="btn btn-primary w-100">
                        Register
                    </button>
                </form>

            </div>
        </div>

    </div>
</div>

<!-- End the page content -->
{% endblock %}
