<!-- Use the shared base template -->
{% extends 'tickets/base.html' %}

<!-- Set the page title -->
{% block title %}Login{% endblock %}

<!-- Start the page content -->
{% block content %}

<!-- Center the login form on the page -->
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

        <!-- Create a card for the login form -->
        <div class="card shadow-sm">
            <div class="card-body p-4">

                <!-- Display the page heading -->
                <h1 class="h3 mb-4 text-center">Login</h1>

                <!-- Submit the login form using POST -->
                <form method="post">

                    <!-- Protect the form against CSRF attacks -->
                    {% csrf_token %}

                    <!-- Display the login fields generated by Django -->
                    {{ form.as_p }}

                    <!-- Submit the login form -->
                    <button type="submit" class="btn btn-primary w-100">
                        Login
                    </button>
                </form>

                <!-- Provide a link to the registration page -->
                <p class="text-center mt-3 mb-0">
                    Don't have an account?
                    <a href="{% url 'register' %}">Register</a>
                </p>

            </div>
        </div>

    </div>
</div>

<!-- End the page content -->
{% endblock %}
